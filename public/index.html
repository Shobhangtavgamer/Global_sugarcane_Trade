      /* Critical above-the-fold styles */
      * {

      /* Loading Screen - Critical for UX */
      .loading-screen {
        position: fixed;

        background: linear-gradient(135deg, #22c55e, #16a34a);
        display: flex;
        align-items: center;

        z-index: 9999;

      .loading-bar {
        width: 250px;
        height: 4px;
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
        overflow: hidden;
        margin: 20px auto 0;
      }
      
      .loading-progress {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 2px;
        animation: loading 2s ease-in-out;
        transform: translateX(-100%);
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(0); }
      }
      
      /* Hide content until loaded */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      body.loaded #root {
        opacity: 1;
      }
      
      body.loaded .loading-screen {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <!-- Enhanced JavaScript for Better UX -->
    <script>
      // Performance monitoring
      const perfStart = performance.now();
      
      // Loading screen management
      let loadingProgress = 0;
      const loadingProgressBar = document.querySelector('.loading-progress');
      const loadingScreen = document.getElementById('loading-screen');
      
      // Simulate progressive loading
      const progressInterval = setInterval(() => {
        loadingProgress += Math.random() * 15;
        if (loadingProgress > 85) {
          loadingProgress = 85;
        }
        if (loadingProgressBar) {
          loadingProgressBar.style.transform = `translateX(${loadingProgress - 100}%)`;
        }
      }, 100);
      
      // When everything is loaded
      window.addEventListener('load', function() {
        clearInterval(progressInterval);
        
        // Complete the loading bar
        if (loadingProgressBar) {
          loadingProgressBar.style.transform = 'translateX(0%)';
        }
        
        // Wait a moment for the bar to complete, then fade out
        setTimeout(() => {
          document.body.classList.add('loaded');
          
          // Performance metrics
          const loadTime = performance.now() - perfStart;
          console.log(`🌾 SugarTrade Global loaded in ${Math.round(loadTime)}ms`);
          
          // Optional: Send analytics
          if (typeof gtag !== 'undefined') {
            gtag('event', 'page_load_time', {
              'event_category': 'Performance',
              'value': Math.round(loadTime)
            });
          }
        }, 500);
      });
      
      // Enhanced mobile experience
      let isTouch = false;
      document.addEventListener('touchstart', function() {
        isTouch = true;
        document.body.classList.add('touch-device');
      }, { once: true });
      
      // Prevent zoom on double tap (iOS)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
      
      // Service Worker Registration for PWA (if available)
      if ('serviceWorker' in navigator && process.env.NODE_ENV === 'production') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Error handling for better UX
      window.addEventListener('error', function(e) {
        console.error('Application error:', e.error);
        
        // Show user-friendly error message
        if (loadingScreen && loadingScreen.style.opacity !== '0') {
          const errorMsg = document.createElement('div');
          errorMsg.style.cssText = `
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-size: 0.9rem;
          `;
          errorMsg.textContent = 'Loading issue detected. Please refresh the page.';
          loadingScreen.appendChild(errorMsg);
        }
      });
      
      // Optimize for different connection speeds
      if ('connection' in navigator) {
        const connection = navigator.connection;
        if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
          document.body.classList.add('slow-connection');
          // Reduce animations, optimize images, etc.
        }
      }
      
      // Keyboard navigation support
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
          document.body.classList.add('keyboard-navigation');
        }
      });
      
      document.addEventListener('mousedown', function() {
        document.body.classList.remove('keyboard-navigation');
      });
      
      // Accessibility improvements
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      
      if (prefersDark.matches) {
        document.body.classList.add('prefers-dark');
      }
      
      if (prefersReducedMotion.matches) {
        document.body.classList.add('prefers-reduced-motion');
      }
      
      // Listen for changes
      prefersDark.addEventListener('change', (e) => {
        document.body.classList.toggle('prefers-dark', e.matches);
      });
      
      prefersReducedMotion.addEventListener('change', (e) => {
        document.body.classList.toggle('prefers-reduced-motion', e.matches);
      });
      
      // Online/Offline status
      function handleOnlineStatus() {
        if (navigator.onLine) {
          document.body.classList.remove('offline');
        } else {
          document.body.classList.add('offline');
          // Show offline notification
          console.warn('Application is offline. Some features may not work.');
        }
      }
      
      window.addEventListener('online', handleOnlineStatus);
      window.addEventListener('offline', handleOnlineStatus);
      handleOnlineStatus(); // Initial check
      
      // Smooth scroll polyfill for older browsers
      if (!('scrollBehavior' in document.documentElement.style)) {
        // Load smooth scroll polyfill
        const script = document.createElement('script');
        script.src = 'https://polyfill.io/v3/polyfill.min.js?features=smoothscroll';
        document.head.appendChild(script);
      }
      
      // Print optimization
      window.addEventListener('beforeprint', function() {
        document.body.classList.add('printing');
      });
      
      window.addEventListener('afterprint', function() {
        document.body.classList.remove('printing');
      });
    </script>
